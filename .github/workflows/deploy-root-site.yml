name: Deploy to Root GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build for root site
        run: npm run build
        env:
          VITE_BASE: /

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to Hongbro886.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ROOT_SITE_DEPLOY_TOKEN }}
          external_repository: Hongbro886/Hongbro886.github.io
          publish_branch: main
          publish_dir: dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
